[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
markers = [
  "integration: requires external services such as Redis and Celery worker",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
# The existing application predates Ruff and has a large formatting backlog.
# Keep CI-safe correctness checks enabled while the style backlog is retired.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["backend/app"]
